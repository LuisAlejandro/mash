name: Artifacts

# Builds the release artifacts and delivers Linux packages to APT, at an exact tag.
#
# Mirrors wholmaster's shape: `release.yml` verifies the tag, then dispatches
# this at that tag, and only this workflow touches the release's assets. It is
# only ever started that way, so it cannot publish on a branch push.
#
# Mash ships three downloadable artifacts from one tag: a macOS arm64 DMG and
# two Debian packages. Linux packages also enter the signed APT repository. The
# release stays a draft until artifacts and the APT index verify, so a failed
# platform or publication leaves an unpublished release rather than a partial one.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. 1.2.3"
        required: true
        type: string

permissions:
  contents: write # required to upload release assets
  id-token: write # required by actions/attest-build-provenance
  attestations: write # required by actions/attest-build-provenance

concurrency:
  group: artifacts-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  # Both are pinned because neither is free to drift. Ghostty upstream pins a
  # Zig version and fails compilation on a mismatch, and the fork requires
  # 0.16.0; the fork commit is what makes a release reproducible.
  ZIG_VERSION: "0.16.0"
  GHOSTTY_FORK: "LuisAlejandro/ghostty"
  GHOSTTY_FORK_REF: "fork-main"
  # Full SHA, compared exactly: a short prefix could collide, and this pin is
  # what makes a released DMG traceable to a specific terminal build. Move it
  # whenever the fork gains a commit.
  GHOSTTY_FORK_COMMIT: "95e69dbd83cb4a04dd086335264874a2d366ce8a"
  # Mash Programming Skills, whose skills and agents are copied into the app.
  # The build refuses any other version. Both skills repos now cut releases and
  # tag them, so the pin is the tag rather than a commit SHA: a tag names a
  # released, tested state, and a commit only names where a branch happened to
  # be. The repo is public, so this clones anonymously.
  SKILLS_VERSION: "0.5.15"
  SKILLS_REPO: "LuisAlejandro/mash-programming-skills"
  SKILLS_REF: "0.5.15"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: get-version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          # The release workflow passes the tag it verified. `v` is tolerated
          # because tags are written without it here.
          TAG="${TAG#v}"
          [ -n "$TAG" ] || { echo "a release tag is required" >&2; exit 1; }
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "version=${TAG}" >>"$GITHUB_OUTPUT"
          echo "building version ${TAG}"

  build-macos:
    name: Build Mash.dmg
    needs: [setup]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      # The runner's Xcode is the one input this workflow cannot pin here: the
      # path and name vary by image, and Ghostty's build is Xcode-sensitive.
      # Print it so the first failure is diagnosable instead of mysterious.
      - name: Report the toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version

      # The build wants a "Developer ID Application" identity in the keychain
      # and notarization credentials in the environment. Everything after this
      # step is unchanged from what runs locally.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MASH_KEYCHAIN_PASSWORD: ${{ secrets.MASH_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${MACOS_CERT_P12:-}" ] || { echo "MACOS_CERT_P12 is not set" >&2; exit 1; }
          keychain="$RUNNER_TEMP/mash-signing.keychain-db"
          echo "MASH_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
          echo "MASH_KEYCHAIN_PASSWORD=$MASH_KEYCHAIN_PASSWORD" >>"$GITHUB_ENV"
          security create-keychain -p "$MASH_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$MASH_KEYCHAIN_PASSWORD" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MASH_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      # Xcode ships the Metal compiler as a separate component. Ghostty's build
      # needs it, and its stub stays broken until TOOLCHAINS names it, so the
      # identifier is read back rather than hardcoded: it changes with Xcode.
      - name: Install Metal Toolchain
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          tc="$(xcodebuild -showComponent MetalToolchain | sed -n 's/^Toolchain Identifier: //p')"
          [ -n "$tc" ] || { echo "could not read the Metal toolchain identifier" >&2; exit 1; }
          echo "MASH_METAL_TOOLCHAIN=$tc" >>"$GITHUB_ENV"
          echo "Metal toolchain: $tc"

      - name: Install Zig
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/zig-$ZIG_VERSION"
          mkdir -p "$dest"
          curl -fL --retry 3 --max-time 900 -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$dest" --strip-components=1
          echo "MASH_ZIG=$dest/zig" >>"$GITHUB_ENV"
          "$dest/zig" version

      - name: Clone the Ghostty fork
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/ghostty"
          git clone --depth 1 --branch "$GHOSTTY_FORK_REF" \
            "https://github.com/${GHOSTTY_FORK}.git" "$dest"
          actual="$(git -C "$dest" rev-parse HEAD)"
          # The pin is what makes a release reproducible, so a branch that moved
          # has to stop the build rather than quietly ship something else.
          if [ "$actual" != "$GHOSTTY_FORK_COMMIT" ]; then
            echo "fork $GHOSTTY_FORK_REF is at $actual, expected $GHOSTTY_FORK_COMMIT" >&2
            exit 1
          fi
          echo "MASH_GHOSTTY_SRC=$dest" >>"$GITHUB_ENV"
          git -C "$dest" log --oneline -1

      - name: Clone the pinned skills checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ env.SKILLS_REF }}
          path: skills

      - name: Verify the skills version
        run: |
          set -euo pipefail
          # The build pins this exact version and refuses anything else, so fail
          # here rather than deep inside the packaging pipeline.
          got="$(tr -d '[:space:]' <skills/VERSION)"
          [ "$got" = "$SKILLS_VERSION" ] || {
            echo "skills checkout is $got, want $SKILLS_VERSION" >&2
            exit 1
          }
          echo "MASH_SKILLS_SRC=$GITHUB_WORKSPACE/skills" >>"$GITHUB_ENV"
          echo "skills $got from $SKILLS_REPO@$SKILLS_REF"

      # The build refuses to continue without this checkout, and it lives at a
      # maintainer's home path by default, so CI has to supply it explicitly.
      # packaging/release.sh builds, signs, notarizes and staples. It needs no
      # change for CI: it already takes credentials from the environment, and
      # the ZIG/MASH_* variables above are the same knobs used locally.
      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          ./packaging/release.sh

      # Prove the artifact is what we claim before it is published: the same
      # checks a user's Gatekeeper would make, run on the file being shipped.
      - name: Verify the DMG
        run: |
          set -euo pipefail
          dmg="$PWD/dist/Mash.dmg"
          [ -f "$dmg" ] || { echo "dist/Mash.dmg was not produced" >&2; exit 1; }
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          hdiutil attach -nobrowse -readonly "$dmg" >/tmp/attach.txt
          mnt="$(awk -F'	' '/\/Volumes\//{print $NF}' /tmp/attach.txt | tail -1)"
          codesign --verify --deep --strict "$mnt/Mash.app"
          # Gatekeeper's own verdict on the app a user will actually launch.
          spctl --assess --type execute -vv "$mnt/Mash.app"
          hdiutil detach "$mnt" >/dev/null

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp dist/Mash.dmg "release-artifacts/Mash-${VERSION}-mac-arm64.dmg"
          cd release-artifacts
          shasum -a 256 ./*.dmg >checksums-sha256.txt
          cat checksums-sha256.txt
        env:
          VERSION: ${{ needs.setup.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-release-artifacts
          path: release-artifacts/
          retention-days: 7


  build-linux:
    name: Build letsmash (${{ matrix.debarch }})
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            debarch: amd64
            zig_triple: x86_64-linux
          - runner: ubuntu-24.04-arm
            debarch: arm64
            zig_triple: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      # Everything the Linux half needs comes from the distro plus the pinned
      # sources. No Docker, so the artifact is built the way a maintainer builds
      # it and smoke-tested in the same step.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 python3-pil \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            build-essential pkg-config gettext libxml2-utils xz-utils unzip file patch \
            libgtk-4-dev libadwaita-1-dev meson ninja-build \
            dpkg-dev patchelf lintian fakeroot rsync xdg-utils weston

      # Ubuntu 24.04 ships blueprint-compiler 0.12, which Ghostty rejects, and
      # 0.20+ rejects Ghostty's own .blp files. 0.16 is built from its tag.
      - name: Install blueprint-compiler
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v0.16.0 \
            https://gitlab.gnome.org/jwestman/blueprint-compiler.git "$RUNNER_TEMP/bp"
          cd "$RUNNER_TEMP/bp"
          meson setup _b --prefix=/usr/local >/dev/null
          sudo meson install -C _b >/dev/null
          blueprint-compiler --version

      - name: Install Zig
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/zig-$ZIG_VERSION"
          mkdir -p "$dest"
          curl -fL --retry 3 --max-time 900 -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig_triple }}-${ZIG_VERSION}.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$dest" --strip-components=1
          echo "MASH_ZIG=$dest/zig" >>"$GITHUB_ENV"
          "$dest/zig" version

      - name: Clone the Ghostty fork
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/ghostty"
          git clone --depth 1 --branch "$GHOSTTY_FORK_REF" \
            "https://github.com/${GHOSTTY_FORK}.git" "$dest"
          actual="$(git -C "$dest" rev-parse HEAD)"
          if [ "$actual" != "$GHOSTTY_FORK_COMMIT" ]; then
            echo "fork $GHOSTTY_FORK_REF is at $actual, expected $GHOSTTY_FORK_COMMIT" >&2
            exit 1
          fi
          echo "MASH_GHOSTTY_SRC=$dest" >>"$GITHUB_ENV"

      - name: Clone the pinned skills checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ env.SKILLS_REF }}
          path: skills

      - name: Build the package
        env:
          MASH_SKILLS_SRC: ${{ github.workspace }}/skills
          MASH_BUILD_CACHE: ${{ github.workspace }}/.cache
        run: |
          set -euo pipefail
          ./packaging/build-linux.sh
          ls -lh dist/*.deb

      - name: Verify the installed tree
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          ./packaging/tests/verify-linux-installed.sh "$deb"

      # The session proof the plan promised: the installed package is launched
      # inside a real session bus under Xvfb and weston headless. Failures here
      # stop the release the same way a broken build does.
      - name: Session smoke (Xorg)
        run: ./packaging/tests/linux-session-smoke.sh "$(ls dist/*.deb)" xorg

      - name: Session smoke (Wayland)
        run: ./packaging/tests/linux-session-smoke.sh "$(ls dist/*.deb)" wayland

      # Provenance is the Linux substitute for a codesigned binary: it ties the
      # file to this workflow, commit and tag, which no embedded .deb signature
      # would do for a direct download.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.deb

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp dist/*.deb "release-artifacts/letsmash-${VERSION}-linux-${{ matrix.debarch }}.deb"
          cd release-artifacts
          sha256sum ./*.deb >"checksums-linux-${{ matrix.debarch }}.txt"
          cat "checksums-linux-${{ matrix.debarch }}.txt"
        env:
          VERSION: ${{ needs.setup.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.debarch }}-release-artifacts
          path: release-artifacts/
          retention-days: 7

  attach-release:
    name: Attach release assets
    needs: [setup, build-macos, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: "*-release-artifacts"
          path: artifacts/
          merge-multiple: true

      # One checksum manifest for the whole release, recomputed here so no
      # per-job file can drift or collide when several platforms upload.
      - name: Combine checksums
        run: |
          set -euo pipefail
          cd artifacts
          rm -f checksums-*.txt
          sha256sum ./*.deb ./*.dmg >checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          cd artifacts
          for f in *; do
            [ -f "$f" ] || continue
            echo "uploading $f"
            gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done

      - name: Note the download in the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          note="

          ## Download

          - \`Mash-${VERSION}-mac-arm64.dmg\` — macOS, Apple silicon. Signed and notarized.
          - \`letsmash-${VERSION}-linux-amd64.deb\` — Ubuntu 24.04, x86_64
          - \`letsmash-${VERSION}-linux-arm64.deb\` — Ubuntu 24.04, arm64
          - \`checksums-sha256.txt\` — SHA-256 checksums for every file above

          ### Linux

          Ubuntu 24.04 with GNOME on Wayland or Xorg. The package installs Mash
          under \`/opt/letsmash\` and keeps everything you configure in
          \`~/.mash\`; upgrades and removal leave that folder alone. To remove it
          as well, delete it yourself afterwards.

          \`\`\`sh
          sudo apt install ./letsmash-${VERSION}-linux-amd64.deb
          \`\`\`

          Installing also configures Mash's signed APT repository, so later
          releases arrive with your ordinary system update. To upgrade
          explicitly:

          \`\`\`sh
          sudo apt update
          sudo apt install --only-upgrade letsmash
          \`\`\`

          Verify a download before installing:

          \`\`\`sh
          sha256sum -c checksums-sha256.txt
          gh attestation verify letsmash-${VERSION}-linux-amd64.deb --repo $GITHUB_REPOSITORY
          \`\`\`

          Other distributions, other desktops and other architectures are not
          supported by this release.

          ### macOS

          Verify with:

          \`\`\`sh
          shasum -a 256 -c checksums-sha256.txt
          spctl --assess --type open --context context:primary-signature -v Mash-${VERSION}-mac-arm64.dmg
          \`\`\`"
          if printf '%s' "$body" | grep -q '## Download'; then
            echo "download section already present, leaving the notes alone"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "${body}${note}"
          fi

  # Deliver both Linux packages to APT after every platform artifact has built
  # and the release assets/notes are attached, but before the release becomes
  # public. If publication or verification fails, the release stays a draft.
  publish-apt:
    name: Publish to APT
    needs: [setup, attach-release, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Download the Linux packages
        uses: actions/download-artifact@v5
        with:
          pattern: "linux-*-release-artifacts"
          path: artifacts/
          merge-multiple: true

      - name: Publish the packages to the repository
        env:
          MASH_APT_HOST: ${{ vars.MASH_APT_HOST || 'apt.letsma.sh' }}
          MASH_APT_USER: ${{ vars.MASH_APT_USER || 'letsmash-repo' }}
          MASH_APT_KEY: ${{ runner.temp }}/mash-apt-key
          MASH_APT_KNOWN_HOSTS_FILE: ${{ runner.temp }}/mash-apt-known-hosts
          MASH_APT_DEPLOY_KEY: ${{ secrets.MASH_APT_DEPLOY_KEY }}
          MASH_APT_KNOWN_HOSTS: ${{ vars.MASH_APT_KNOWN_HOSTS }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "${MASH_APT_DEPLOY_KEY:-}" ] || { echo "MASH_APT_DEPLOY_KEY is not configured" >&2; exit 1; }
          [ -n "${MASH_APT_KNOWN_HOSTS:-}" ] || { echo "MASH_APT_KNOWN_HOSTS is not configured" >&2; exit 1; }
          install -m 600 /dev/null "$MASH_APT_KEY"
          install -m 600 /dev/null "$MASH_APT_KNOWN_HOSTS_FILE"
          trap 'rm -f "$MASH_APT_KEY" "$MASH_APT_KNOWN_HOSTS_FILE"' EXIT
          printf '%s\n' "$MASH_APT_DEPLOY_KEY" >"$MASH_APT_KEY"
          printf '%s\n' "$MASH_APT_KNOWN_HOSTS" >"$MASH_APT_KNOWN_HOSTS_FILE"
          ./packaging/apt/publish.sh "$VERSION" artifacts

      - name: Verify apt can consume the signed release
        run: ./packaging/tests/apt-upgrade-smoke.sh

  # A release is public only after the signed APT indices contain both
  # architectures and the Ubuntu runner has verified them using the key shipped
  # in the package.
  publish-release:
    name: Publish release
    needs: [setup, attach-release, publish-apt]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          printf '%s\n' "$assets"
          for expected in checksums-sha256.txt "Mash-${VERSION}-mac-arm64.dmg" \
            "letsmash-${VERSION}-linux-amd64.deb" "letsmash-${VERSION}-linux-arm64.deb"; do
            printf '%s\n' "$assets" | grep -qxF "$expected" || {
              echo "refusing to publish: $expected is not attached" >&2
              exit 1
            }
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "release $TAG is public"

