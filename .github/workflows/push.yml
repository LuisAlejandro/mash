name: Push

# Gate every push to a long-lived branch.
#
# This exists because scripts/release.sh waits for it. release_wait_for_branch_ci
# polls `gh run list --workflow push.yml --branch release/<version>` before the
# release is merged, and RELEASE_CI_WORKFLOW defaults to exactly this filename.
# Without it that wait polls for 45 minutes and then fails the release, which is
# what happened before this was added.
#
# Keep the filename: the release scripts key on it.

on:
  push:
    branches:
      - develop
      - master
      - "release/**"
  # Manual runs are useful when a gate is suspected of being flaky.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same branch, but never cancel one on
  # master: a release may be waiting on that exact run.
  group: push-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same script the release workflow runs, so the two cannot disagree about
      # what "ready" means.
      - name: Verify version, release inputs and shell syntax
        run: ./scripts/preflight.sh

  tests:
    name: Tests (${{ matrix.os }})
    # Every platform the product ships on runs the same entry point. A suite
    # that only passes on the build machine is not verified, and the previous
    # macOS-only lane could not have caught a Linux-only helper regression.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The wizard picks the dictation model from a vendored catalog, so a
      # refreshed pi-voice that drifts from packaging/wizard/data must fail here
      # rather than at a user's first launch. scripts/test.sh runs this itself;
      # the runner just has to provide the toolchain.
      - name: Check the Rust toolchain
        run: cargo --version

      - name: Run every suite
        run: ./scripts/test.sh
