name: Push

# Gate every push to a long-lived branch.
#
# This exists because scripts/release.sh waits for it. release_wait_for_branch_ci
# polls `gh run list --workflow push.yml --branch release/<version>` before the
# release is merged, and RELEASE_CI_WORKFLOW defaults to exactly this filename.
# Without it that wait polls for 45 minutes and then fails the release, which is
# what happened before this was added.
#
# Keep the filename: the release scripts key on it.

on:
  push:
    branches:
      - develop
      - master
      - "release/**"
  # Manual runs are useful when a gate is suspected of being flaky.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run for the same branch, but never cancel one on
  # master: a release may be waiting on that exact run.
  group: push-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same script the release workflow runs, so the two cannot disagree about
      # what "ready" means.
      - name: Verify version, release inputs and shell syntax
        run: ./scripts/preflight.sh

  tests:
    name: Tests (${{ matrix.os }})
    # Every platform the product ships on runs the same entry point. A suite
    # that only passes on the build machine is not verified, and the previous
    # macOS-only lane could not have caught a Linux-only helper regression.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Mash's menus live in the fork and replay chords this repository binds,
      # so the suite that compares the two needs the fork checked out. Without
      # it that test skips, and a menu item pointing at an unbound chord would
      # only surface at release time.
      - name: Clone the pinned Ghostty fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LuisAlejandro/ghostty
          ref: fork-main
          path: ghostty-fork

      - name: Point the suite at the fork
        run: echo "MASH_GHOSTTY_SRC=$GITHUB_WORKSPACE/ghostty-fork" >>"$GITHUB_ENV"

      # Mash ships zsh, bash and fish startup files and asserts that each one
      # really runs: PATH order, atuin, Starship, completion, and where the
      # completion dump lands. macOS runners carry zsh already; the Ubuntu
      # image does not, and test_pane_shell_rc fails rather than skipping so
      # the gap is visible instead of silently halving that suite's coverage.
      - name: Install zsh for the pane-shell suite
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      # The wizard picks the dictation model from a vendored catalog, so a
      # refreshed pi-voice that drifts from packaging/wizard/data must fail here
      # rather than at a user's first launch. scripts/test.sh runs this itself;
      # the runner just has to provide the toolchain.
      - name: Check the Rust toolchain
        run: cargo --version

      - name: Run every suite
        run: ./scripts/test.sh
