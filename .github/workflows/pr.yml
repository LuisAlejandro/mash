name: Pull Request

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify version, release inputs and shell syntax
        run: ./scripts/preflight.sh

  tests:
    name: Tests (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    # The same platform matrix as the push gate. This lane was macOS-only, so
    # four Linux-only failures passed review and only turned red after merge,
    # on develop -- where the break is public and no longer attached to the
    # change that caused it. A gate that runs fewer platforms than the branch
    # it protects is not a gate.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mash's menus live in the fork and replay keys this repository binds,
      # for both keybinding modes. Without the fork the menu suite skips, and a
      # menu item pointing at an unbound key would only surface at release.
      - name: Clone the Ghostty fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LuisAlejandro/ghostty
          ref: fork-main
          path: ghostty-fork
          persist-credentials: false

      - name: Point the suite at the fork
        run: echo "MASH_GHOSTTY_SRC=$GITHUB_WORKSPACE/ghostty-fork" >>"$GITHUB_ENV"

      # Same reason as the push gate: the pane-shell suite asserts that Mash's
      # zsh startup files really run, and the Ubuntu image ships no zsh. The
      # image also leaves /usr/share/zsh world-writable, which makes compinit
      # refuse to load completion; tighten it as a normal install would be.
      - name: Install zsh for the pane-shell suite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          sudo chmod -R go-w /usr/share/zsh

      # One entry point for every suite, shared with `make test` and the push
      # gate, so a test cannot run here and be skipped there (or the reverse).
      - name: Run every suite
        run: ./scripts/test.sh

  # The develop ruleset requires a check named exactly "Tests". The matrix
  # above reports "Tests (macos-latest)" and "Tests (ubuntu-24.04)" instead,
  # so without this job the required check never appears and every PR stays
  # blocked. It passes only when every platform passed: a failed, cancelled or
  # skipped leg fails it, which `always()` makes it report rather than skip.
  tests-result:
    name: Tests
    if: always() && github.event.pull_request.draft == false
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform to pass
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "platform tests: $RESULT"
          test "$RESULT" = success
