name: Pull Request

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify version, release inputs and shell syntax
        run: ./scripts/preflight.sh

  tests:
    name: Tests
    if: github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the wizard tests
        run: cargo test --locked --manifest-path packaging/wizard/Cargo.toml
      - name: Run the helper and packaging tests
        run: |
          set -euo pipefail
          failed=0

          for t in \
            packaging/tests/test_mash_isolate.sh \
            packaging/tests/test_mash_force_updates.sh \
            packaging/helpers/tests/test-annotate-paste-target.sh \
            packaging/helpers/tests/test-telescope-files-path.sh \
            packaging/helpers/tests/test-mash-voice-model.sh
          do
            if (cd "$(dirname "$t")" && bash "$(basename "$t")"); then
              echo "PASS $t"
            else
              echo "FAIL $t"
              failed=1
            fi
          done

          for t in \
            packaging/tests/test_first_launch_layout.py \
            packaging/tests/test_design_pi_sync.py \
            packaging/tests/test_penpot_account_setup.py
          do
            if python3 "$t"; then
              echo "PASS $t"
            else
              echo "FAIL $t"
              failed=1
            fi
          done

          exit "$failed"
