name: Publish Release

# Gates a draft release at an exact tag, then hands off to artifacts.yml.
#
# Dispatched by scripts/release.sh right after it creates the draft. It is not
# triggered by publishing, because publishing is now the *last* step of the
# build: a release created in the GitHub UI builds nothing, and a build cannot
# re-enter itself by flipping its own draft public.
#
# The gate is deliberately the same script a maintainer runs locally via
# `make release-preflight`, told which version the tag claims, so the two paths
# cannot disagree about what "ready" means.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify and build, e.g. 1.2.3"
        required: true
        type: string

concurrency:
  group: publish-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to dispatch artifacts.yml

jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Verify tag, version and release inputs
        run: ./scripts/preflight.sh "${{ github.event.inputs.tag }}"

  dispatch-artifacts:
    name: Dispatch Artifacts
    needs: verify-release-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger exact-tag Artifacts workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # The gate above already proved the tag matches VERSION; read it back
          # at that exact ref so the built app carries the released version.
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$TAG" \
            -q .content | base64 --decode | tr -d '[:space:]')"
          echo "dispatching Artifacts for $TAG (VERSION=$version)"
          gh workflow run artifacts.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f tag="$TAG"
