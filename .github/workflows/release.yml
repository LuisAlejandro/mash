name: Publish Release

# Runs when a release is published, at that exact tag.
#
# Mirrors wholmaster's two-workflow shape: this one gates the tag, then hands
# off to artifacts.yml, which is the only thing that touches the release's
# assets. Keeping them separate means the long, credential-using macOS build
# is a dispatch at a known tag rather than a side effect of publishing.
#
# The gate is deliberately the same script a maintainer runs locally via
# `make release-preflight`, told which version the tag claims, so the two paths
# cannot disagree about what "ready" means.

on:
  release:
    types: [published]

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to dispatch artifacts.yml

jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify tag, version and release inputs
        run: ./scripts/preflight.sh "${{ github.event.release.tag_name }}"

  dispatch-artifacts:
    name: Dispatch Artifacts
    needs: verify-release-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger exact-tag Artifacts workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # The gate above already proved the tag matches VERSION; read it back
          # at that exact ref so the built app carries the released version.
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$TAG" \
            -q .content | base64 --decode | tr -d '[:space:]')"
          echo "dispatching Artifacts for $TAG (VERSION=$version)"
          gh workflow run artifacts.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f tag="$TAG"
