[bumpversion]
current_version = 0.1.0
commit = True
tag = True
tag_name = {new_version}

# The app version lives in exactly one file, and `packaging/build.sh` reads it
# from there, so this is the whole version surface.
#
# The [maintainer-tools] post_bump_commands hook lives here too when a bump has
# to regenerate something. Mash does not need one: nothing else embeds the
# version, and the DMG is built from the tag rather than from the working copy.

[bumpversion:file:VERSION]
