# Mash's shared prompt for bash, zsh and fish.
# Powerlevel10k-inspired Powerline style. Keep it portable: no remote commands,
# and no modules that read personal shell startup files. Users can customize
# this seeded copy in ~/.mash/config.
add_newline = true
# Starship gives each command 500ms by default. Right after a restart every pane
# renders at once, with git still on a cold disk, and a command over budget
# prints a timeout warning above the first prompt. A slow first prompt beats a
# warning; a warm prompt is unaffected.
command_timeout = 2000
palette = "mash"

format = """\
[](fg:gray)\
$os\
[](fg:gray bg:blue)\
$directory\
$custom\
$git_branch\
$git_status\
"""
right_format = """\
$status\
$cmd_duration\
$jobs\
$direnv\
$asdf\
$python\
$conda\
$pyenv\
$nodejs\
$golang\
$rust\
$java\
$kubernetes\
$terraform\
$aws\
$azure\
$gcloud\
$nix_shell\
$docker_context\
$username\
$hostname\
"""

[os]
format = "[$symbol]($style)"
style = "fg:near_black bg:gray"
disabled = false

[os.symbols]
Macos = " "

[directory]
format = "[ $path ]($style)"
style = "fg:light bg:blue"
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = " "
format = "[](fg:blue bg:green)[ $symbol$branch ]($style)"
style = "fg:dark bg:green"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "[$all_status$ahead_behind]($style)[](fg:green) "
style = "fg:dark bg:green"
conflicted = " ~$count"
ahead = " ⇡$count"
behind = " ⇣$count"
diverged = " ⇕$count"
untracked = " ?$count"
stashed = " *$count"
modified = " !$count"
staged = " +$count"
deleted = " ✘$count"

[status]
disabled = false
format = "$symbol"
symbol = "[✘](bold fg:yellow bg:red) "
success_symbol = "[✔](bold fg:green bg:dark) "

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "
style = "fg:dark bg:yellow"

[jobs]
symbol = "✦ "
format = "[$symbol]($style) "
style = "fg:cyan bg:dark"

[direnv]
style = "fg:yellow bg:dark"

[username]
show_always = false
format = "[$user]($style)"
style_user = "fg:yellow bg:dark"
style_root = "fg:red bg:dark"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "fg:yellow bg:dark"

# The no_git module closes the directory block with the same angled end when
# no Git segment follows, so the left prompt never ends flat outside a repo.
[custom.no_git]
# /bin/sh, not the pane's shell: Starship runs `when` through STARSHIP_SHELL,
# and zsh loads Mash's .zshenv first, costing ~40ms against 11ms on every prompt.
shell = ["/bin/sh"]
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1"
command = "true"
format = "[\uE0B0](fg:blue)"

[palettes.mash]
near_black = "#080808"
dark = "#2E2F35"
red = "#FF2052"
green = "#00FF80"
yellow = "#F9BD27"
blue = "#00BFFF"
cyan = "#00D7FF"
gray = "#C2C9D4"
light = "#E4E4E4"
