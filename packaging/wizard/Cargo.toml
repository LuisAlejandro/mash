[package]
name = "mash-wizard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mash-wizard"
path = "main.rs"

[dependencies]
# line_count keeps mouse hit rows identical to wrapped rendering.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Level-triggered poll keeps input readable when a resize and a key arrive together.
# The default mio backend can consume the resize and lose the TTY readiness edge.
crossterm = { version = "0.28", features = ["use-dev-tty"] }

[profile.release]
lto = true
strip = true
opt-level = "z"
