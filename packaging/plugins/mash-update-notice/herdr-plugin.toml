# The update notice popup, opened by bin/mash-update-notice once it has decided
# a newer version exists. Both versions and the platform's verdict arrive
# through --env.
#
# Two panes because the platforms end differently. Linux opens `notice`, which
# is read-only: apt owns installing, so the popup only names the command. macOS
# opens `update`, which offers the update itself, since there is no package
# manager to hand off to.
id = "mash-update-notice"
name = "Mash Update Notice"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Tell the user, once per version, that a newer Mash is available"
platforms = ["linux", "macos"]

[[panes]]
id = "notice"
title = "Mash update"
placement = "popup"
# Outer cells, border included. The script sees 53x9 (herdr 0.9.3 subtracts
# the border and one more column). 11 is the smallest height at which every
# shipped notice translation fits when wrapped at that width.
width = 56
height = 11
command = ["bash", "notice.sh"]

# Taller than the notice: this pane narrates the download and verification.
# The determinate progress window is a separate process outside the pane.
# The prompt translations fit in 61x14, so the box stays 64x16.
[[panes]]
id = "update"
title = "Mash update"
placement = "popup"
width = 64
height = 16
command = ["bash", "update.sh"]

[[panes]]
id = "updated"
title = "Mash updated"
placement = "popup"
# 56x9 still holds the longest updated translation (53x7 inside the border).
width = 56
height = 9
command = ["bash", "updated.sh"]
