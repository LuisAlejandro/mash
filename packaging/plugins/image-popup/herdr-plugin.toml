# Show an image file in a Herdr popup with real pixels (Kitty graphics).
#
# A popup is a client-side surface: it is rendered by the terminal window the
# user is looking at, not stored as a pane on the server. That is why opening it
# with `herdr plugin pane open --placement popup` from a background helper
# returns "ok" and draws nothing -- there is no client on that call. The pane
# appears when it is opened by a plugin ACTION, which runs in the client's own
# context. The Fresh plugin therefore invokes the action below.
id = "image-popup"
name = "Image Popup"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Show an image with real pixels in a popup, via the Kitty graphics protocol"
platforms = ["macos", "linux"]

[[panes]]
id = "view"
title = "Image"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "view.sh"]

[[actions]]
id = "show"
title = "Show image in a popup"
contexts = ["pane"]
command = ["bash", "view.sh"]
