# Show an image file in a Herdr popup with real pixels (Kitty graphics).
#
# A popup is a client-side surface: it is rendered by the terminal window the
# user is looking at, not stored as a pane on the server. On herdr 0.9.3,
# `herdr plugin pane open --placement popup` from a background helper or an
# event hook does draw, centered, while a client is attached; only a call with
# no client attached is unproven, and is the likely source of the earlier
# "returns ok and draws nothing" observation. See
# .mash/insights/herdr-popup-from-background.md.
id = "image-popup"
name = "Image Popup"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Show an image with real pixels in a popup, via the Kitty graphics protocol"
platforms = ["macos", "linux"]

[[panes]]
id = "view"
title = "Image"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "view.sh"]

[[actions]]
id = "show"
title = "Show image in a popup"
contexts = ["pane"]
command = ["bash", "view.sh"]
