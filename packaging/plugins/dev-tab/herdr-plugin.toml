id = "dev-tab"
name = "Dev Tab"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Shape a bare new tab into the same two-pane layout as cmd+t (editor + agent)"
platforms = ["macos", "linux"]

# Herdr's "+" tab button runs the built-in new_tab action, which takes no
# configuration, so the only way to decide what "+" produces is to react to the
# tab it creates. Every tab creation fires this event, so the hook filters
# carefully (see dev-tab.sh) and never creates a tab of its own.
[[events]]
on = "tab.created"
command = ["bash", "dev-tab.sh"]
