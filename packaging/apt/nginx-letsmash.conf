# Nginx server block for the Mash APT repository.
#
# bootstrap-letsmash-repo.sh substitutes @HOSTNAME@ and @REPO_ROOT@ and installs
# this to /etc/nginx/sites-available/letsmash-apt, along with a TLS server block
# once a certificate exists.
#
# Only dists/, pool/ and the exported public key are public. conf/, db/,
# incoming/ and .gnupg/ must never be served: conf/distributions names the
# signing key, and incoming/ is a write target.
#
# This site is deliberately separate from dockershelf-apt, which the same host
# also serves. Never merge the two.

server {
    listen 80;
    listen [::]:80;
    server_name @HOSTNAME@;
    server_tokens off;

    location /dists/ {
        alias @REPO_ROOT@/dists/;
        autoindex off;
        limit_except GET HEAD { deny all; }
    }
    location /pool/ {
        alias @REPO_ROOT@/pool/;
        autoindex off;
        limit_except GET HEAD { deny all; }
    }
    location = /letsmash-apt-signing.pub {
        alias @REPO_ROOT@/letsmash-apt-signing.pub;
        limit_except GET HEAD { deny all; }
    }
    location / {
        return 404;
    }
}
